[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-watch"
version = "0.1.0"
description = "Active token monitoring and reduction advisement system for multinode multi-agent networks"
readme = "README.md"
authors = [
    { name = "Token Watch Contributors" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
tokenwatch = "tokenwatch.cli:main"
tokenwatch-hub = "tokenwatch.hub:main"
tokenwatch-sidecar = "tokenwatch.sidecar:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

